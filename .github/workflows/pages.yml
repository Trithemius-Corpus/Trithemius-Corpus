name: Deploy site to GitHub Pages

# This workflow validates the checked-in publication and uploads those same bytes.
# The reader-quality workflow independently exercises reconstruction.

on:
  push:
    branches: [main]
    paths:
      - "site/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate the publication at the triggering commit
        run: |
          python scripts/check_publication.py
          python scripts/run_epubcheck.py site/dist/editions/epub/*.epub
          git diff --exit-code HEAD -- site/dist
          test -z "$(git ls-files --others -- site/dist)"
      - name: Upload the validated directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: validate-and-upload
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
