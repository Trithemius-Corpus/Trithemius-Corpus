name: Reader quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Run regressions and verify the source ledgers
        run: |
          python -m unittest discover -s tests
          python scripts/build_editorial_ledger.py --check
          python scripts/build_translation_disagreements.py --check
          python scripts/validate_passages.py --source-only
      - name: Reconstruct from the public sources
        run: |
          python scripts/build_site.py
          python scripts/build_publication_exports.py
          python scripts/build_search.py
      - name: Validate the reconstructed publication
        run: |
          python scripts/check_publication.py
          python scripts/run_epubcheck.py site/dist/editions/epub/*.epub
