name: Reader quality

on:
  pull_request:
    paths:
      - "data/reader_fixtures.json"
      - "data/schemas/**"
      - "METHODOLOGY.md"
      - "requirements.txt"
      - "scripts/audit_layout.py"
      - "scripts/build_site.py"
      - "scripts/build_t4b_pages.py"
      - "scripts/make_cover.py"
      - "scripts/passage_model.py"
      - "scripts/validate_passages.py"
      - "scripts/validate_reader.py"
      - "site/templates/**"
      - "site/static/**"
      - "site/dist/**"
      - ".github/workflows/reader-quality.yml"
  push:
    branches: [main]
    paths:
      - "data/reader_fixtures.json"
      - "data/schemas/**"
      - "METHODOLOGY.md"
      - "requirements.txt"
      - "scripts/audit_layout.py"
      - "scripts/build_site.py"
      - "scripts/build_t4b_pages.py"
      - "scripts/make_cover.py"
      - "scripts/passage_model.py"
      - "scripts/validate_passages.py"
      - "scripts/validate_reader.py"
      - "site/templates/**"
      - "site/static/**"
      - "site/dist/**"
      - ".github/workflows/reader-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed reader
        run: python scripts/validate_reader.py

      - name: Install reader dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate passage model and schemas
        run: python scripts/validate_passages.py --source-only

      - name: Build clean reader and passage artifacts
        run: |
          python scripts/build_site.py
          python scripts/build_t4b_pages.py

      - name: Validate clean reader and passage artifacts
        run: |
          python scripts/validate_reader.py
          python scripts/validate_passages.py
